:root.ciemny{--tlo:#0B0F0D;--pow:#121915;--pow2:#101613;--pow3:#18211C;--wybrany:#16201B;--linia:#1E2823;--ramka:#24302A;--ramka2:#33423A;--tekst:#EEF4F0;--tekst2:#9DAEA4;--tekst3:#85948B;--akcja:#5DFF8A;--naAkcji:#052012;--wolne:#5DFF8A;--pelne:#FFC85C;--zaduzo:#FF7A7A;--moc:#7CC0FF;--aktywny:#EEF4F0;--naAktywnym:#0B0F0D;--nieaktywny:#C9D6CF;--cien:rgba(0,0,0,.5);--wylaczony:#1F2924;--naWylaczonym:#85948B;--okTlo:#14241B;--okRamka:#2F6B47;--okTekst:#8CF5B0;--uwTlo:#2A2213;--uwRamka:#6E5422;--uwTekst:#FFD27A;--blTlo:#2A1616;--blRamka:#5C2B2B;--blTekst:#FF9B9B;--mocTlo:#15283D;--mocRamka:#2B4C70;--mocTekst:#9CCFFF;--zaslona:rgba(0,0,0,.62);--R:#E3A882;--F:#9CC7A6;--T:#8DB6E0;--zM:#E7C26E;--zB:#B9B3DE;--mTab:#B4A5FF;--mMag:#F0B25A;--mRap:#7CB7FF;--mMan:#5DFF8A;--mTra:#8DB6E0;--mObe:#D7A6EA;--mHar:#7FD6D6;color-scheme:dark}
:root.jasny{color-scheme:light}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--tlo);color:var(--tekst);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;text-align:inherit}
button:disabled,button[aria-disabled="true"]{cursor:default}
button:active:not(:disabled):not([aria-disabled="true"]){filter:brightness(.93)}
:focus{outline:none}
:focus-visible{outline:3px solid var(--moc);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--tekst)}
svg{display:block;flex:0 0 auto}
p{margin:0}
h1,h2,h3{margin:0;text-wrap:balance}
.bebas{font-family:"Bebas Neue","Avenir Next Condensed","Roboto Condensed","Arial Narrow",Inter,sans-serif;font-weight:400;letter-spacing:.05em;line-height:1}
.etykieta{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--tekst3)}
.cyfry{font-variant-numeric:tabular-nums}
.mono{font-family:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.ukryte{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{height:100%;display:flex;flex-direction:column;min-height:0;padding-top:env(safe-area-inset-top,0px)}
@keyframes wjazd{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes potrzasnij{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.potrzasnij{animation:potrzasnij .4s ease}

/* ── nagłówek ── */
.nag{flex:0 0 auto;min-height:60px;display:flex;align-items:center;gap:14px;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(20px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--linia);background:var(--tlo);position:relative;z-index:5}
.nag-l{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.nag-tyt{font-size:30px;padding-top:3px;white-space:nowrap}
.pokaz-chip{font-size:11px;font-weight:800;letter-spacing:.08em;padding:3px 7px;border-radius:6px;border:1px solid var(--uwRamka);background:var(--uwTlo);color:var(--uwTekst)}
.nawig{flex:1 1 auto;min-width:0;display:flex;justify-content:center}
.nawig-w{display:inline-flex;gap:2px;padding:3px;border-radius:12px;background:var(--pow);border:1px solid var(--ramka);max-width:100%;overflow-x:auto;scrollbar-width:none}
.nawig-w::-webkit-scrollbar{display:none}
.nawig-w button{position:relative;height:38px;padding:0 12px;border-radius:9px;font-size:14px;font-weight:700;color:var(--nieaktywny);display:flex;align-items:center;gap:6px;white-space:nowrap}
.nawig-w button[aria-current="page"]{background:var(--aktywny);color:var(--naAktywnym)}
.licz{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--uwTlo);color:var(--uwTekst);border:1px solid var(--uwRamka);font-size:11.5px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.nawig-w button[aria-current="page"] .licz{background:var(--naAktywnym);color:var(--aktywny);border-color:transparent}
.nag-p{display:flex;align-items:center;gap:12px;flex:0 0 auto}
.nag-czas{font-size:22px;padding-top:2px;white-space:nowrap;font-variant-numeric:tabular-nums}
.menu-btn{height:42px;max-width:170px;padding:0 10px 0 6px;border-radius:11px;border:1px solid var(--ramka);background:var(--pow);display:flex;align-items:center;gap:8px;min-width:0}
.menu-imie{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:1320px){.nag-czas{display:none}}
@media (max-width:900px){.nag{flex-wrap:wrap;padding-top:6px;padding-bottom:6px;gap:8px 10px}.nawig{order:3;flex:1 0 100%;justify-content:flex-start}.nag-l{flex:1 1 auto}.nag-tyt{font-size:26px}}
@media (max-width:520px){.menu-imie{display:none}.menu-btn{padding:0 5px}}

/* ── awatar, chipy, przyciski ── */
.awatar{--kol:var(--tekst3);width:34px;height:34px;flex:0 0 34px;border-radius:50%;background:var(--pow3);border:2px solid var(--kol);color:var(--kol);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800}
.awatar.duzy{width:56px;height:56px;flex-basis:56px;font-size:22px}
.awatar.maly{width:28px;height:28px;flex-basis:28px;font-size:12px;border-width:1.5px}
.awatar.urz{border-radius:9px}
.glowny{min-height:52px;padding:0 20px;border-radius:15px;background:var(--akcja);color:var(--naAkcji);font-size:16px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.glowny.maly{min-height:44px;padding:0 16px;border-radius:12px;font-size:15px}
.glowny:disabled,.glowny[aria-disabled="true"]{background:var(--wylaczony);color:var(--naWylaczonym)}
.glowny.czerwony{background:var(--zaduzo);color:#fff}
.glowny.ciemny{background:var(--aktywny);color:var(--naAktywnym)}
.drugi{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--ramka2);background:transparent;color:var(--tekst);font-size:14.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-align:center}
.drugi.maly{min-height:36px;padding:0 11px;border-radius:10px;font-size:13.5px}
.drugi.czerwony{color:var(--blTekst);border-color:var(--blRamka)}
.drugi.zielony{color:var(--okTekst);border-color:var(--okRamka)}
.drugi.uwaga{color:var(--uwTekst);border-color:var(--uwRamka);background:var(--uwTlo)}
.drugi[aria-pressed="true"]{background:var(--aktywny);color:var(--naAktywnym);border-color:var(--aktywny)}
.link{display:inline-flex;align-items:center;gap:6px;color:var(--mocTekst);font-weight:700;font-size:14px;min-height:36px}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:3px;border-radius:11px;background:var(--pow);border:1px solid var(--ramka)}
.seg button{min-height:34px;min-width:40px;padding:0 11px;border-radius:8px;font-size:13.5px;font-weight:700;color:var(--nieaktywny);display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--aktywny);color:var(--naAktywnym)}
.seg button:disabled{opacity:.4}
.pill{display:inline-flex;align-items:center;gap:5px;min-height:22px;padding:1px 8px;border-radius:7px;border:1px solid var(--ramka2);font-size:12px;font-weight:700;color:var(--tekst2);white-space:nowrap;line-height:1.2}
.pill.ok{background:var(--okTlo);border-color:var(--okRamka);color:var(--okTekst)}
.pill.uw{background:var(--uwTlo);border-color:var(--uwRamka);color:var(--uwTekst)}
.pill.bl{background:var(--blTlo);border-color:var(--blRamka);color:var(--blTekst)}
.pill.moc{background:var(--mocTlo);border-color:var(--mocRamka);color:var(--mocTekst)}
.pill.cicha{border-style:dashed;color:var(--tekst3)}
.mb{--kol:var(--tekst3);display:inline-flex;align-items:center;gap:6px;min-height:24px;padding:2px 8px 2px 6px;border-radius:7px;border:1px solid var(--ramka);background:var(--pow2);font-size:12px;font-weight:700;color:var(--tekst2);white-space:nowrap}
.mb::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--kol);flex:0 0 auto}
.mb b{color:var(--tekst);font-weight:800}
.ikona{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ikona.mala{width:15px;height:15px}

/* ── układ treści ── */
.tresc{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.wnetrze{width:min(1180px,100%);margin:0 auto;padding:20px max(20px,env(safe-area-inset-right,0px)) 40px max(20px,env(safe-area-inset-left,0px))}
.karta{border:1px solid var(--ramka);background:var(--pow);border-radius:16px;padding:16px}
.karta-tyt{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.karta-tyt h2{font-size:17px;font-weight:800}
.h1{font-size:26px;font-weight:800;line-height:1.2}
.pod{font-size:14px;color:var(--tekst2);max-width:70ch}
.pod b{color:var(--tekst)}
.siatka{display:grid;gap:14px}
.puste{padding:28px 16px;text-align:center;color:var(--tekst2);display:flex;flex-direction:column;align-items:center;gap:10px}

/* ── ZDZISŁAW ── */
.zdz{position:relative;display:block;flex:0 0 auto;-webkit-tap-highlight-color:transparent}
.zdz img{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;pointer-events:none}
.zdz.unosi img{animation:unos 3.4s ease-in-out infinite}
@keyframes unos{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.zdz.unosi::after{content:"";position:absolute;left:22%;right:22%;bottom:-2%;height:9%;border-radius:50%;background:radial-gradient(closest-side,rgba(111,211,255,.42),rgba(111,211,255,0));animation:pole 3.4s ease-in-out infinite;pointer-events:none}
@keyframes pole{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
.zdz.wej img{animation:zdzWej .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes zdzWej{from{transform:translateY(10px) scale(.96);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.zdz.unosi img,.zdz.unosi::after,.zdz.wej img{animation:none}}
.dymek{position:relative;background:#1d1d1d;color:#e8f3ec;border:2px solid #9fe3b4;border-radius:16px;padding:12px 15px 13px;box-shadow:0 6px 22px rgba(0,0,0,.18);font-size:14.5px;line-height:1.45}
.dymek .d-tyt{font-family:"Bebas Neue","Avenir Next Condensed","Roboto Condensed","Arial Narrow",Inter,sans-serif;letter-spacing:.07em;color:#9fe3b4;font-size:17px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.dymek .d-tyt .kursor{width:8px;height:15px;background:#e2a54e;display:inline-block;animation:mrugK 1s steps(1) infinite}
@keyframes mrugK{50%{opacity:0}}
.dymek .d-pod{margin-top:7px;font-size:12px;color:#a9c9b6}
.dymek b{color:#fff}
.dymek .d-akcje{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.dymek .d-akcje button{min-height:34px;padding:0 12px;border-radius:9px;border:1px solid #9fe3b4;color:#9fe3b4;font-size:13px;font-weight:800}
.dymek::after{content:"";position:absolute;width:16px;height:16px;background:#1d1d1d;border:2px solid #9fe3b4;border-top:0;border-left:0}
.dymek.ogon-dol::after{left:var(--ogon,50%);bottom:-10px;transform:translateX(-50%) rotate(45deg)}
.dymek.ogon-lewo::after{left:-10px;top:var(--ogon,40px);transform:rotate(135deg)}
.dymek.ogon-prawo::after{right:-10px;top:var(--ogon,40px);transform:rotate(-45deg)}
.dymek.wej{animation:wjazd .25s ease}

/* ── start i PIN ── */
.start{flex:1;min-height:0;overflow-y:auto}
.start-w{width:min(1040px,100%);margin:0 auto;padding:34px max(20px,env(safe-area-inset-right,0px)) 36px max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:22px}
.start-gora{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.start-logo{font-size:58px}
.start-pod{font-size:14px;color:var(--tekst2);display:block;margin-top:6px}
.start-pod.pokaz{color:var(--uwTekst)}
.start-uklad{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:center}
.kafelki{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
@media (min-width:640px){.kafelki{grid-template-columns:repeat(3,minmax(0,1fr))}}
.kafel{min-height:104px;padding:12px 14px;border-radius:16px;border:1px solid var(--ramka);background:var(--pow);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:6px;text-align:left}
.kafel-imie{font-size:18px;font-weight:800}
.kafel-rola{font-size:12.5px;color:var(--tekst2)}
.kafel-inna{border-style:dashed;border-color:var(--ramka2);background:transparent;color:var(--tekst2);font-size:16px;font-weight:700;align-items:center}
.start-zdz{display:flex;flex-direction:column;align-items:center;gap:14px}
.start-zdz .zdz{width:220px}
.pole{display:flex;flex-direction:column;gap:6px}
.pole input,.pole select,.pole textarea{min-height:50px;padding:0 14px;border-radius:13px;border:1px solid var(--ramka2);background:var(--pow2);font-size:17px}
.pole select{padding-right:34px;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--tekst2) 50%),linear-gradient(135deg,var(--tekst2) 50%,transparent 50%);background-position:calc(100% - 18px) 22px,calc(100% - 12px) 22px;background-size:6px 6px;background-repeat:no-repeat}
.pole input:focus,.pole select:focus{border-color:var(--moc);outline:none}
.pole .blad{font-size:13px;color:var(--zaduzo);font-weight:600}
.pole .pomoc{font-size:12.5px;color:var(--tekst3)}
.pin-uklad{display:grid;grid-template-columns:minmax(0,400px) 240px;gap:40px;justify-content:center;align-items:center}
.pin{width:100%;display:flex;flex-direction:column;align-items:center;gap:16px}
.pin-imie{font-size:28px;font-weight:800}
.pin-pod{font-size:15px;color:var(--tekst2)}
.kropki{display:flex;gap:11px;height:22px;align-items:center}
.kropki span{width:16px;height:16px;border-radius:8px;border:2px solid var(--ramka2)}
.kropki span.p{background:var(--tekst);border-color:var(--tekst)}
.klaw-pin{width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kl{height:62px;border-radius:16px;border:1px solid var(--ramka);background:var(--pow);font-size:27px;font-weight:600;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center}
.kl.maly{font-size:15px;font-weight:700;color:var(--tekst2)}
.pin-hint{font-size:13px;color:var(--tekst2);text-align:center}
.pin-zdz{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.pin-zdz .zdz{width:180px}
.pin-zdz p{font-size:13px;color:var(--tekst2);max-width:24ch}
@media (max-width:760px){.start-zdz .dymek.ogon-dol::after{left:-10px;bottom:auto;top:40px;transform:rotate(135deg)}.start-uklad{grid-template-columns:1fr}.start-zdz{flex-direction:row-reverse;align-items:flex-end}.start-zdz .zdz{width:120px}.start-zdz .dymek{flex:1}.pin-uklad{grid-template-columns:1fr;gap:12px}.pin-zdz{order:-1;flex-direction:row;gap:12px;text-align:left}.pin-zdz .zdz{width:70px}.start-logo{font-size:46px}}

/* ── pulpit ── */
.pulpit{display:grid;grid-template-columns:330px minmax(0,1fr);gap:22px;align-items:start}
.zdz-panel{position:sticky;top:0;display:flex;flex-direction:column;align-items:center;gap:16px;padding-top:4px}
.zdz-panel .dymek{width:100%}
.zdz-panel .zdz{width:240px;margin-top:4px}
.zdz-panel .zdz-pod{font-size:12px;color:var(--tekst3)}
.zrob{display:flex;flex-direction:column}
.zrob-w{display:flex;align-items:center;gap:14px;padding:12px 2px;border-top:1px solid var(--linia)}
.zrob-w:first-child{border-top:0;padding-top:2px}
.zrob-ik{width:42px;height:42px;flex:0 0 42px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--pow3);color:var(--tekst2)}
.zrob-ik.uw{background:var(--uwTlo);color:var(--uwTekst)}
.zrob-ik.moc{background:var(--mocTlo);color:var(--mocTekst)}
.zrob-ik.bl{background:var(--blTlo);color:var(--blTekst)}
.zrob-tr{flex:1;min-width:0}
.zrob-tr b{display:block;font-size:15.5px}
.zrob-tr span{font-size:13px;color:var(--tekst2)}
.liczby{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.liczba{padding:12px;border-radius:13px;background:var(--pow2);border:1px solid var(--linia);text-align:left}
.liczba b{display:block;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.liczba span{font-size:12.5px;color:var(--tekst2)}
button.liczba:active{filter:brightness(.95)}
.zespoly{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.belki{display:flex;flex-direction:column;gap:9px}
.belka{display:grid;grid-template-columns:132px minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:13.5px}
.belka .tor{height:10px;border-radius:5px;background:var(--pow3);overflow:hidden}
.belka .tor i{display:block;height:100%;border-radius:5px;background:var(--kol)}
.belka b{text-align:right;font-variant-numeric:tabular-nums}
.belka.wkrotce{color:var(--tekst3)}
.belka.wkrotce .tor{background:repeating-linear-gradient(90deg,var(--pow3) 0 6px,transparent 6px 10px)}
.zmiany{display:flex;flex-direction:column}
.zmiana{display:grid;grid-template-columns:86px minmax(0,1fr);gap:10px;padding:9px 0;border-top:1px solid var(--linia);font-size:13.5px}
.zmiana:first-child{border-top:0;padding-top:0}
.zmiana time{color:var(--tekst3);font-variant-numeric:tabular-nums;font-size:12.5px;padding-top:1px}
.zmiana small{display:block;color:var(--tekst3);font-size:12px;margin-top:1px}

}

/* kosztometr.dysza.app — moduł Księgowa (na wspólnym wyglądzie managera: styl.css). Minimalizm i symetria: równe karty, wyrównane pola. */
:root{--mKsi:#9B3D5A;--info:#2F74C0;--naInfo:#FFFFFF;--arch:#B8892A;--archTlo:rgba(184,137,42,.10);--archRamka:rgba(184,137,42,.5)}
:root.ciemny{--mKsi:#F2A0B8;--arch:#e8c06a;--archTlo:rgba(232,192,106,.12);--archRamka:rgba(232,192,106,.55)}

/* Architekt — złoto ponad kolorami modułów (jak w managerze) */
.arch{display:inline-flex;align-items:center;gap:5px;padding:2px 9px 2px 7px;border-radius:999px;border:1px solid var(--archRamka);background:var(--archTlo);color:var(--arch);font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;vertical-align:middle}
.arch .ikona{width:14px;height:14px;stroke-width:2.2}
.arch-t{color:var(--arch);font-weight:800}
.awatar.arch-aw{box-shadow:0 0 0 2px var(--tlo),0 0 0 4px var(--arch)}

/* nagłówek: tytuł modułu w kolorze modułu, ikona „i” (wersja D) tuż przed kafelkiem z imieniem */
.info-i{width:42px;height:42px;flex:0 0 42px;border-radius:50%;background:var(--info);color:var(--naInfo);display:inline-flex;align-items:center;justify-content:center;font:italic 700 26px/1 Georgia,"Times New Roman",serif;padding-bottom:1px}
.nawig-w .wkrotce{color:var(--tekst3);font-weight:600;border:1px dashed var(--ramka2);margin-left:4px}
@media (max-width:640px){.info-i{width:44px;height:44px;flex-basis:44px}}

/* nagłówek strony */
.strona-g{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.strona-g .pod{margin-top:4px}
.sygn{font-size:12px;font-weight:700;color:var(--tekst3);letter-spacing:.04em}

/* trzy pliki — A (księgowa), B1 (FIRMINO towary), B2 (FIRMINO koszty), ta sama budowa */
.pliki{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:stretch}
.plik{border:1px solid var(--ramka);background:var(--pow);border-radius:16px;padding:16px;display:grid;grid-template-rows:auto 1fr auto;gap:12px;min-width:0}
.plik-g{display:grid;grid-template-columns:40px minmax(0,1fr);align-items:center;gap:12px}
.plik-lit{width:40px;height:40px;border-radius:12px;border:2px solid var(--kol,var(--ramka2));color:var(--kol,var(--tekst2));display:flex;align-items:center;justify-content:center;font-size:24px;padding-top:2px;flex:0 0 auto}
.plik-lit.dwa{font-size:21px;letter-spacing:.02em}
.plik-lit.mini{display:inline-flex;width:26px;height:22px;border-radius:7px;border-width:1.5px;font-size:13px;vertical-align:middle;padding-top:1px}
.plik-tyt b{display:block;font-size:16px;font-weight:800;letter-spacing:.02em}
.plik-tyt span{display:block;font-size:13px;color:var(--tekst2)}
.plik-pole{position:relative;border:1.5px dashed var(--ramka2);border-radius:14px;min-height:118px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:14px;text-align:center;color:var(--tekst2);cursor:pointer;-webkit-tap-highlight-color:transparent}
.plik-pole:hover,.plik-pole.nad{border-color:var(--moc);background:var(--mocTlo);color:var(--mocTekst)}
.plik-pole input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.plik-pole .ikona{width:26px;height:26px}
.plik-pole b{color:var(--tekst);font-size:15px}
.plik-pole small{font-size:12.5px;color:var(--tekst3)}
.plik-ok{border:1px solid var(--linia);background:var(--pow2);border-radius:14px;padding:12px 14px;display:grid;gap:10px;align-content:start;min-height:118px}
.plik-ok .nz{display:flex;align-items:center;gap:8px;min-width:0;font-weight:700;font-size:14px}
.plik-ok .nz > span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1 1 auto}
.plik-ok .nz .plik-zmien{flex:0 0 auto;margin-left:auto;font-size:13px;min-height:32px;padding:0 10px}
.plik-ok .nz .plik-zmien .ikona{color:inherit;width:15px;height:15px}
.plik-ok .nz .ikona{color:var(--okTekst)}
.plik-ok .licz-w b{font-size:16px}
.plik-ok .ark{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;font-size:12.5px}
.plik-ok .ark button,.plik-ok .ark .ark-j{min-height:28px;padding:0 9px;border-radius:8px;border:1px solid var(--ramka2);font-size:12.5px;font-weight:700;color:var(--tekst2);display:inline-flex;align-items:center}
.plik-ok .ark button[aria-pressed="true"]{background:var(--aktywny);color:var(--naAktywnym);border-color:var(--aktywny)}
.plik-blad{font-size:13px;color:var(--blTekst);font-weight:600}
.plik-zmien{justify-self:end}
.przyklad{display:flex;justify-content:center;margin-top:10px;text-align:center}
p.przyklad{max-width:760px;margin:10px auto 0}

/* ZDZISŁAW i dymek nad wynikiem */
.zdz-rz{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;align-items:center;margin:18px 0 6px}
.zdz-rz .zdz{width:120px}
.zdz-rz .dymek{max-width:820px}
.zdz-start{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;align-items:center;margin-top:18px;max-width:760px}
.zdz-start .zdz{width:150px}
@media (max-width:640px){.zdz-rz,.zdz-start{grid-template-columns:84px minmax(0,1fr);gap:10px}.zdz-rz .zdz,.zdz-start .zdz{width:84px}}

/* trzy kafle podsumowania: Księgowa — Porównanie — FIRMINO */
.liczby{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:16px 0}
.licz-k{border:1px solid var(--ramka);background:var(--pow);border-radius:16px;padding:14px 16px;display:grid;gap:10px;align-content:start}
.licz-k h3{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--tekst3);display:flex;align-items:center;gap:8px}
.licz-k h3::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--kol,var(--tekst3))}
.licz-w{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:baseline;font-size:14px;color:var(--tekst2)}
.licz-w b{font-size:17px;font-weight:800;color:var(--tekst);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.licz-w b.ok{color:var(--okTekst)} .licz-w b.uw{color:var(--uwTekst)} .licz-w b.bl{color:var(--blTekst)}
.licz-w small{font-size:13px;font-weight:800}
.licz-w b.pom,.plik-ok .licz-w b.pom{font-size:14px;font-weight:700;color:var(--tekst2)}

/* sterowanie: filtr | rejestr, szukaj | kopiuj — na węższym: filtr; rejestr | kopiuj; szukaj */
.ster{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"filtr rej" "szuk kop";gap:10px 14px;align-items:center;margin:6px 0 12px}
.ster > .seg:not(.rej){grid-area:filtr;justify-self:start}
.ster > .rej{grid-area:rej;justify-self:end}
.ster .szukaj{grid-area:szuk;height:44px;max-width:520px}
.ster .kop{grid-area:kop;justify-self:end}
.ster .seg{max-width:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.ster .seg::-webkit-scrollbar{display:none}.ster .seg button{flex:0 0 auto}
.seg .licz-s{font-size:11.5px;font-weight:800;opacity:.75;font-variant-numeric:tabular-nums}
@media (max-width:1100px){.ster{grid-template-areas:"filtr filtr" "rej kop" "szuk szuk"}.ster > .rej{justify-self:start}.ster .szukaj{max-width:none}}
@media (max-width:760px){.ster{grid-template-columns:minmax(0,1fr);grid-template-areas:"filtr" "rej" "szuk" "kop"}.ster > .seg:not(.rej),.ster > .rej,.ster .kop{justify-self:stretch}}

/* tabela dokumentów księgowej */
.tab-w{border:1px solid var(--ramka);background:var(--pow);border-radius:16px;overflow:auto;max-height:min(74vh,980px);overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
table.tab{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
.tab th{position:sticky;top:0;z-index:2;background:var(--pow2);text-align:left;padding:10px 10px;border-bottom:1px solid var(--ramka);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--tekst3);white-space:nowrap}
.tab td{padding:9px 10px;border-bottom:1px solid var(--linia);vertical-align:middle;white-space:nowrap}
.tab tbody tr{cursor:pointer}
.tab tbody tr:hover td,.tab tbody tr:focus-visible td{background:var(--pow3)}
.tab th.k,.tab td.k{text-align:right;font-variant-numeric:tabular-nums}
.tab th.s,.tab td.s{text-align:center}
.tab th.g,.tab td.g{border-left:1px solid var(--linia)}
.tab th:first-child{left:0;z-index:3}
.tab td:first-child{position:sticky;left:0;z-index:1;background:var(--pow)}
.tab td:first-child b{display:block;font-size:14.5px;font-weight:800}
.tab td:first-child small{display:block;max-width:230px;overflow:hidden;text-overflow:ellipsis;font-size:12px;color:var(--tekst3);margin-top:1px}
.tab tfoot td{position:sticky;bottom:0;z-index:2;background:var(--pow2);border-top:1px solid var(--ramka);border-bottom:0;font-weight:800}
.tab tfoot td:first-child{z-index:3;background:var(--pow2)}
.tab .stan{display:inline-flex;align-items:center;justify-content:center;min-width:46px;min-height:24px;padding:1px 8px;border-radius:7px;border:1px solid var(--ramka2);font-size:12.5px;font-weight:800}
.tab .stan.ok{background:var(--okTlo);border-color:var(--okRamka);color:var(--okTekst)}
.tab .stan.uw{background:var(--uwTlo);border-color:var(--uwRamka);color:var(--uwTekst)}
.tab .stan.bl{background:var(--blTlo);border-color:var(--blRamka);color:var(--blTekst)}
.tab .stan.cicha{border-style:dashed;color:var(--tekst3);background:transparent}
.tab .roz{font-weight:800}
.tab .roz.plus{color:var(--uwTekst)} .tab .roz.minus{color:var(--blTekst)}
.tab .nr{display:inline-flex;align-items:center;gap:6px;max-width:210px}
.tab .nr span{overflow:hidden;text-overflow:ellipsis}
.tab .tag{font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:6px;border:1px solid var(--ramka2);color:var(--tekst3);flex:0 0 auto}
.tab .tag.uw{border-color:var(--uwRamka);color:var(--uwTekst);background:var(--uwTlo)}
.tab .wf .nr{display:flex}
.tab .kontr{display:block;max-width:210px;overflow:hidden;text-overflow:ellipsis;color:var(--uwTekst);font-weight:700;font-size:12.5px;margin-top:2px}
.tab .nr + .kontr{margin-top:3px}
.tab .dni{font-weight:700;color:var(--tekst2)} .tab .dni.uw{color:var(--uwTekst)}
.tab .brak{color:var(--tekst3)}
.tab-pusta{padding:28px 16px;text-align:center;color:var(--tekst2)}

/* sekcje pod tabelą */
.sekcja{margin-top:26px}
.sekcja-g{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.sekcja-g h2{font-size:18px;font-weight:800}
.sekcja-g .pod{font-size:13.5px}
.tab.b td:first-child{position:static}
.podp{font-size:12.5px;color:var(--tekst3)}
.notatka{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border:1px dashed var(--uwRamka);background:var(--uwTlo);border-radius:14px;color:var(--uwTekst);font-size:14px}
.notatka b{color:var(--tekst)}

/* ustawienia mechanizmu i zasady */
.zasady{border:1px solid var(--ramka);background:var(--pow);border-radius:16px;padding:6px 16px}
.zasady summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px;font-weight:800;font-size:15px}
.zasady summary::-webkit-details-marker{display:none}
.zasady summary .ikona{transition:transform .2s}
.zasady[open] summary .ikona{transform:rotate(90deg)}
.zasady-t{display:grid;gap:14px;padding:4px 0 16px}
.ustaw{display:grid;grid-template-columns:200px minmax(0,1fr);gap:10px 16px;align-items:center}
.ustaw > span{font-size:14px;font-weight:700;color:var(--tekst2)}
.zasady ol{margin:0;padding-left:20px;display:grid;gap:6px;font-size:14px;color:var(--tekst2);max-width:92ch}
.zasady ol b{color:var(--tekst)}
@media (max-width:640px){.ustaw{grid-template-columns:1fr}}

/* okno szczegółów: Księgowa | FIRMINO w dwóch wyrównanych kolumnach */
.porown{display:grid;grid-template-columns:118px minmax(0,1fr) minmax(0,1fr);border:1px solid var(--ramka);border-radius:14px;overflow:hidden}
.porown > div{padding:9px 12px;border-bottom:1px solid var(--linia);font-size:14px;min-width:0;overflow-wrap:anywhere}
.porown > div:nth-last-child(-n+3){border-bottom:0}
.porown .et{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--tekst3);background:var(--pow2);display:flex;align-items:center}
.porown .gl{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--tekst2);background:var(--pow2)}
.porown .inne{background:var(--uwTlo);color:var(--uwTekst);font-weight:700}
.porown .k{font-variant-numeric:tabular-nums}
.dlaczego{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lista-pod{display:grid;gap:6px}
.lista-pod div{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--linia);border-radius:11px;background:var(--pow2);font-size:13.5px}
.lista-pod div span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:640px){.porown{grid-template-columns:100px minmax(0,1fr) minmax(0,1fr)}.porown > div{padding:8px;font-size:13px}.porown .et{font-size:10px;letter-spacing:.03em;overflow-wrap:normal;word-break:normal}}

/* telefon i iPad w pionie */
@media (max-width:640px){.liczby{grid-template-columns:1fr}.tab .nv{display:none}}
@media (max-width:1060px){.pliki{grid-template-columns:1fr}}
@media (max-width:640px){.tab td:first-child small{max-width:150px}.tab td,.tab th{padding:8px 9px}}

/* ── produkcja (12.11): miesiąc z bazy, wyjaśnienia, zapis plików, wersje ── */
.uw-t{color:var(--uwTekst)} .cicha-t{color:var(--tekst3);font-weight:700}
.m-wersja{display:block;padding:8px 10px 4px;font-size:12px;color:var(--tekst3);font-variant-numeric:tabular-nums}
.miesiac-w{flex:0 0 240px;gap:4px}
.miesiac-w select{min-height:46px;font-size:16px;font-weight:700}
.blad-w{align-items:center;justify-content:space-between;margin-bottom:14px}
.blad-w .drugi{flex:0 0 auto}
.plik-ok .kto{font-size:13.5px;font-weight:700;color:var(--tekst2);display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.plik-ok .link.wers{min-height:24px;font-size:12.5px;padding:0;text-decoration:underline;text-underline-offset:2px}
.plik-zmien{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.tab .roz.cicha{color:var(--tekst3);font-weight:700}
.tab tr.wyjasniony td{color:var(--tekst2)}
.tab tr.wyjasniony td:first-child b{color:var(--tekst2)}
.wyj-k{display:inline-flex;align-items:center;gap:3px;min-height:24px;padding:1px 7px;border-radius:7px;border:1px solid var(--ramka2);color:var(--tekst2);font-size:12px;font-weight:800}
.wyj-k .ikona{width:15px;height:15px}
.wyj-k.ok{background:var(--okTlo);border-color:var(--okRamka);color:var(--okTekst)}
.wyj-k.uw{background:var(--uwTlo);border-color:var(--uwRamka);color:var(--uwTekst)}
.wyj{display:grid;gap:10px;padding-top:12px;border-top:1px solid var(--linia)}
.wyj-lista{display:grid;gap:8px}
.wpis{border:1px solid var(--linia);background:var(--pow2);border-radius:12px;padding:9px 12px}
.wpis-g{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--tekst3)}
.wpis-g b{color:var(--tekst);font-size:14px}
.wpis p{margin:5px 0 0;font-size:14.5px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.wyj textarea{min-height:76px;padding:10px 14px;font-size:16px;line-height:1.4;resize:vertical;font-family:inherit;color:var(--tekst)}
.wyj textarea:focus{border-color:var(--moc);outline:none}
.wyj-akcje{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center}
.zapis-p{border:1px solid var(--ramka);background:var(--pow2);border-radius:14px;padding:12px 14px;display:grid;gap:10px}
.zapis-p .plik-tyt span{overflow-wrap:anywhere}
.lista-wers{display:grid;gap:8px}
.lista-wers > div{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 12px;border:1px solid var(--linia);border-radius:12px;background:var(--pow2)}
.plik-lit.mala{width:32px;height:32px;border-radius:10px;font-size:19px}
.wers-n b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wers-n small{display:block;font-size:12.5px;color:var(--tekst3)}
@media (max-width:640px){.miesiac-w{flex:1 1 100%}.wyj-akcje{grid-template-columns:1fr 1fr}.wyj-akcje > span{grid-column:1 / -1}}
@media (max-width:1000px){.licz-w small .szer{display:none}}

/* ── 1.1 (12.11 wieczór): trzy pliki, ZATWIERDŹ, UZGODNIJ, historia ── */
.plik-czeka{border:1.5px dashed var(--ramka2);border-radius:14px;min-height:118px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:14px;text-align:center;color:var(--tekst3)}
.plik-czeka .ikona{width:24px;height:24px}
.plik-czeka b{color:var(--tekst2);font-size:15px}
.plik-czeka small{font-size:12.5px}
.zatw{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"stan akcja" "kto kto";gap:6px 10px;align-items:center;padding:10px 12px;border-radius:14px;border:1px solid var(--linia);background:var(--pow2)}
.zatw > .pill{grid-area:stan;justify-self:start;max-width:100%;overflow:hidden}
.zatw > .zatw-k{grid-area:kto}
.zatw > :nth-child(3){grid-area:akcja}
.zatw.ok{border-color:var(--okRamka);background:var(--okTlo)}
.zatw.czeka{border-color:var(--uwRamka)}
.zatw .pill .ikona{width:14px;height:14px}
.zatw-k{font-size:13px;font-weight:700;color:var(--tekst2);min-width:0;overflow-wrap:anywhere}
.zatw.ok .zatw-k{color:var(--okTekst)}
.zatw .zatwierdz{letter-spacing:.04em;white-space:nowrap}
.zatw .zatwierdz:disabled{opacity:1}
.zatw .drugi.maly{min-height:34px}
@media (max-width:640px){.plik-ok .licz-w .ark{grid-column:1 / -1;justify-content:flex-start}}

.uzg{margin-top:14px;border:1px solid var(--ramka);background:var(--pow);border-radius:16px;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"kroki przycisk" "opis opis";gap:12px 18px;align-items:center}
.uzg-kroki{grid-area:kroki;display:flex;flex-wrap:wrap;gap:8px}
.uzg-p{grid-area:przycisk;justify-self:end}
.uzg-o{grid-area:opis;display:flex;align-items:center;justify-content:space-between;gap:8px 16px;flex-wrap:wrap}
.uzg-o p{margin:0;font-size:14px;color:var(--tekst2);max-width:96ch;line-height:1.45}
.uzg-o p b{color:var(--tekst)}
.uzg-l{display:inline-flex;gap:14px;flex-wrap:wrap}
.uzg-l .link{min-height:30px;font-size:13.5px}
.uzg-l .ikona{width:16px;height:16px}
.krok{display:inline-flex;align-items:center;gap:9px;padding:5px 12px 5px 6px;border-radius:13px;border:1px solid var(--ramka2);background:var(--pow2);min-width:0}
.krok b{display:block;font-size:13px;font-weight:800;white-space:nowrap}
.krok small{display:flex;align-items:center;gap:3px;font-size:12px;font-weight:700;color:var(--tekst3);white-space:nowrap}
.krok small .ikona{width:13px;height:13px}
.krok.ok{border-color:var(--okRamka);background:var(--okTlo)} .krok.ok small{color:var(--okTekst)}

  }

  // FIRMINO · towary (16.11.2026): PZ i inne dokumenty niż faktury FAZ nie wchodzą do sumy ani do uzgodnienia — wiersz informacyjny

  function pasekUzg(st, zwin) {

  function renderWynik() {
    var W = S.wynik, wr = wierszeRejestru(), wid = wierszeWidoku(), tB = tylkoBWidoku();
    var s = { dok: wr.length, brutto: 0, tak: 0, takN: 0, nie: 0, zgodne: 0, wTol: 0, kwota: 0, sprawdz: 0, otw: 0, wyj: 0 };

      if (w.zgodny === 'tak') { s.zgodne++; if (w.roznica != null) s.wTol++; } else if (w.zgodny === 'nie') s.kwota++;

      '<div class="licz-k" style="--kol:var(--mMan)"><h3>Porównanie</h3><div class="licz-w">' +

        '<span>Różnica kwoty</span><b class="' + (s.kwota ? 'uw' : '') + '">' + s.kwota + '</b>' +
        '<span>Brak w FIRMINO</span><b class="' + (s.nie ? 'bl' : '') + '">' + s.nie + '</b></div></div>' +
      '<div class="licz-k" style="--kol:var(--mMag)"><h3>FIRMINO · dwa pliki</h3><div class="licz-w">' +

      '</section>';
    var rej = rejestry(), klucze = Object.keys(rej);
    var F = [['wszystkie', 'Wszystkie', s.dok], ['zgodne', 'Zgodne', s.zgodne], ['kwota', 'Różnica', s.kwota], ['brak', 'Brak w FIRMINO', s.nie],

    h += '<div class="ster"><div class="seg" role="group" aria-label="Pokaż">' + F.map(function (f) {

      }).join('') + '<button data-a="rejestr" data-v="*" aria-pressed="' + (S.rejestr === '*') + '">Wszystkie <span class="licz-s">' + plikA().dane.dokumenty.length + '</span></button></div>';
    } else h += '<span class="rej"></span>';

      '<button class="drugi kop" data-a="kopiuj">' + ik('kopiuj', 'mala') + ' Kopiuj widok do arkusza</button></div>';
    h += '<div class="tab-w" id="tab-a">' + tabelaA(wid) + '</div>';

      (tB.length ? '<div class="tab-w">' + tabelaB(tB) + '</div>' : '<div class="karta tab-pusta">' + T('Każdy dokument z FIRMINO w tym widoku ma parę u księgowej.') + '</div>') + '</section>';

    }

      '<span></span><span class="podp">' + T('Ustawienia zmieniają tylko Twój widok — po odświeżeniu wraca 10 zł i ± 3 dni, takie same dla wszystkich.') + '</span>' +
      '</div>' + zasady() + '</div></details></section>';

  }
  function zasady() {

      '<li><b>Literówka w numerze</b> (jeden znak, w długim numerze dwa) u tego samego kontrahenta przy tej samej albo prawie tej samej kwocie — FIRMINO <b>tak</b>, w kolumnie Numer: „literówka”.</li>' +
      '<li><b>Paragony i inne numery</b>: ten sam kontrahent, kwota co do złotówki i data w oknie dni — FIRMINO <b>tak</b>, numer z FIRMINO pokazany obok.</li>' +

      '<li><b>Rejestr T szukamy najpierw w pliku towarów, P — w pliku kosztów.</b> Para z drugiego pliku dostaje znacznik „w kosztach” albo „w towarach”.</li>' +
      '<li><b>2×</b>: w FIRMINO kwota dokładnie dwa razy większa niż w rejestrze, u tego samego kontrahenta — para się liczy, ZGODNY „nie”, znacznik 2× (zwykle koszty samochodu ujęte w rejestrze w połowie).</li>' +
      '<li><b>Inna waluta</b> (np. EUR w FIRMINO, złote w rejestrze) — para bez porównania kwot, do sprawdzenia.</li>' +

  function wiesc(s, tB, wr, bOtw) {

    return t + '<div class="d-pod">' + T(zart) + '</div>';
  }
  function wskazowkiWidoku(wr) {               // powtarzalna nadwyżka w FIRMINO u jednego dostawcy, zwykle o pełne złote (np. kaucja MAKRO)
    var u = {};
    wr.forEach(function (w) {
      var k = w.roznica;
      if (k == null || Math.abs(k) < 1 || (w.flagi && w.flagi.polowa)) return;
      var n = (w.a.nazwa || '').trim().split(/\s+/)[0].toUpperCase();
      u[n] = u[n] || { nazwa: (w.a.nazwa || '').trim(), ile: 0, pelne: 0, plus: 0, suma: 0 };
      u[n].ile++; u[n].suma += k;
      if (Math.abs(k - Math.round(k)) < 0.005) u[n].pelne++;
      if (k > 0) u[n].plus++;
    });
    var naj = Object.keys(u).map(function (k) { return u[k]; }).filter(function (x) { return x.ile >= 3 && x.pelne >= x.ile * 0.6 && x.plus === x.ile; })

    return '<b>' + esc(naj.nazwa) + '</b>: w ' + naj.ile + ' ' + odm(naj.ile, 'fakturze', 'fakturach', 'fakturach') + ' FIRMINO ma więcej (razem ' + zl(naj.suma) + ' zł), zwykle o pełne złote — wygląda na kaucję za opakowania, której nie ma w rejestrze VAT. Do potwierdzenia u księgowej.';
  }
  function polowaWidoku(wr) {                  // FIRMINO = 2 × rejestr (paliwo, leasing, naprawy aut)

    if (!l.length) return '';
    var nazwy = {}; l.forEach(function (w) { nazwy[(w.a.nazwa || '').trim().split(/\s+/)[0].toUpperCase()] = 1; });

      case 'kw-forma': szkicKarty().forma = v; S.kwBlad = ''; odswiezWynik(); break;
      case 'kwe-osoba': S.kwEdycjaSzkic.osoba = v; odswiezWynik(); break;
      case 'kwe-forma': S.kwEdycjaSzkic.forma = v; odswiezWynik(); break;
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.id && /^pr-kw-\d+$/.test(e.target.id)) { e.preventDefault(); zatwierdzPrac(e.target.id.slice(6)); return; }
    if (e.key === 'Enter' && e.target.id === 'pr-nazwa') { e.preventDefault(); dodajPrac(); return; }
    if (e.key === 'Escape' && S.okno && S.okno.typ === 'pracownicy' && (S.pracKorekta != null || S.pracNowy) && !S.wysyla) {
      if (S.pracKorekta != null) delete S.pracKw[S.pracKorekta]; S.pracKorekta = null; S.pracNowy = false; S.pracNazwa = ''; S.pracBlad = ''; renderOkno(); return;
    }
    if (e.key === 'Enter' && e.target.id && /^ks-\d+-(data|okres|kwota)$/.test(e.target.id)) { e.preventDefault(); dodajStala(e.target.id.split('-')[1]); return; }
    if (e.key === 'Enter' && e.target.id && /^kwe?-(nazwa|data|okres|kwota)$/.test(e.target.id)) { e.preventDefault(); if (/^kwe-/.test(e.target.id)) korektaZapisz(); else dodajWpis(); return; }
    if (e.key === 'Escape' && S.kwEdycja && !S.okno && !S.wysyla) { S.kwEdycja = null; S.kwBlad = ''; odswiezWynik(); return; }
    if (e.key === 'Escape' && S.okno && !S.wysyla) { S.okno = null; S.zapis = null; renderOkno(); }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('tr[data-a]')) { e.preventDefault(); e.target.click(); }
  });
  document.addEventListener('change', function (e) {
    var inp = e.target.closest && e.target.closest('input[data-plik]');
    if (inp && inp.files && inp.files.length) { wczytajPliki(Array.prototype.slice.call(inp.files), inp.getAttribute('data-plik')); inp.value = ''; return; }
    if (e.target.id === 'miesiac' && e.target.value && e.target.value !== S.miesiac) {
      if (S.karta === 'F') { S.szukaj = ''; wczytajMiesiac(e.target.value, false); }
      else { S.miesiac = e.target.value; pisz(KL.miesiac, S.miesiac); S.kwEdycja = null; S.kwBlad = ''; wczytajWpisy(false); }
      return;
    }
    if (e.target.id === 'zapis-miesiac' && S.zapis) { S.zapis.miesiac = e.target.value; renderOkno(); }
    poleListy(e.target);
  });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'szukaj') {
      S.szukaj = e.target.value;
      var t = document.getElementById('tab-a');
      if (t) t.innerHTML = tabelaA(wierszeWidoku());
    }
    if (e.target.id === 'wyj-tekst') { var w = e.target.closest('.wyj'); if (w) S.szkic[w.getAttribute('data-klucz')] = e.target.value; }
    var mk = /^(kwe?)-(nazwa|data|okres|kwota)$/.exec(e.target.id || '');
    if (mk) { (mk[1] === 'kw' ? szkicKarty() : S.kwEdycjaSzkic)[mk[2]] = e.target.value; if (S.kwBlad) { S.kwBlad = ''; var b = $('.wp-blad'); if (b) b.remove(); } }
    var ms = /^ks-(\d+)-(data|okres|kwota)$/.exec(e.target.id || '');
    if (ms) { szkicStalej(ms[1])[ms[2]] = e.target.value; if (S.kwBlad) { S.kwBlad = ''; var bs = $('.wp-blad'); if (bs) bs.remove(); } }
    poleListy(e.target);
  });
  function poleListy(t) {                     // pola okna faktur pracowników → szkic (kwota osoby albo nowa osoba)
    var id = (t && t.id) || '', mk = /^pr-kw-(\d+)$/.exec(id);
    if (mk) S.pracKw[mk[1]] = t.value; else if (id === 'pr-nazwa') S.pracNazwa = t.value; else return;
    if (S.pracBlad) { S.pracBlad = ''; var b = document.querySelector('#warstwa .wp-blad'); if (b) b.remove(); }
  }
  document.addEventListener('focusout', function (e) {
    if (e.target.id === 'wyj-tekst') setTimeout(function () { if (S.oknoCzeka && !(document.activeElement && document.activeElement.id === 'wyj-tekst')) renderOkno(); }, 300);
  });
  document.addEventListener('toggle', function (e) { if (e.target.id === 'zasady') S.zasadyOtwarte = e.target.open; if (e.target.id === 'kw-historia') S.kwHistoria = e.target.open; }, true);
  ['dragenter', 'dragover'].forEach(function (n) {
    document.addEventListener(n, function (e) { var z = e.target.closest && e.target.closest('[data-upusc]'); if (z) { e.preventDefault(); z.classList.add('nad'); } });
  });
  document.addEventListener('dragleave', function (e) { var z = e.target.closest && e.target.closest('[data-upusc]'); if (z) z.classList.remove('nad'); });
  document.addEventListener('drop', function (e) {
    var z = e.target.closest && e.target.closest('[data-upusc]');
    if (!z) return;
    e.preventDefault(); z.classList.remove('nad');
    if (e.dataTransfer && e.dataTransfer.files.length) wczytajPliki(Array.prototype.slice.call(e.dataTransfer.files), z.getAttribute('data-upusc'));
  });

  function odswiezWynik() {                   // przerysuj stronę, zostaw miejsce przewinięcia i fokus pola (szukanie, wpis, korekta)
    var tr = document.getElementById('tresc'), y = tr ? tr.scrollTop : 0;
    var a = document.activeElement, aktywny = a && a.id && a.tagName === 'INPUT' ? a.id : null, zaz = null;
    try { if (aktywny && a.selectionStart != null) zaz = [a.selectionStart, a.selectionEnd]; } catch (e) { zaz = null; }
    render();
    tr = document.getElementById('tresc'); if (tr) tr.scrollTop = y;
    if (aktywny) {
      var s = document.getElementById(aktywny);
      if (s && !s.disabled) { s.focus(); try { if (zaz) s.setSelectionRange(zaz[0], zaz[1]); } catch (e) { /* pole daty bez zaznaczenia */ } }
    }
  }

  /* ───────────── start ───────────── */
  window.Ksiegowa = { S: S, przelicz: przelicz, sprawdzZmiany: sprawdzZmiany, stanUzg: stanUzg, wczytajWpisy: wczytajWpisy };   // dla testów
  zastosujMotyw();
  render();
  if (baza.sesja()) start(false); else okno.pokaz();
})();
